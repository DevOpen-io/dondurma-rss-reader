name: ice_cream_rss_reader
description: "Fast, private RSS reader. No algorithms, no tracking. Just your news."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.5.0+20

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  dart_rss: ^3.0.3
  provider: ^6.1.5+1
  html: ^0.15.6
  url_launcher: ^6.3.2
  intl: ^0.20.2
  flutter_html: ^3.0.0
  flex_color_scheme: ^8.2.0
  cached_network_image_ce: ^4.2.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  go_router: ^17.1.0
  file_selector: ^1.0.3
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  webview_flutter: ^4.10.0
  adblocker_webview: ^2.3.0
  flutter_local_notifications: ^21.0.0
  xml: ^6.6.1
  skeletonizer: ^2.1.3
  package_info_plus: ^9.0.1
  workmanager: ^0.9.0+3
  home_widget: ^0.9.3
  connectivity_plus: ^7.3.1
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  meta: ^1.19.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.5
  code_assets: ^2.1.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  # SPM package layout fix; keep the federated API compatible with Android.
  workmanager_apple: 0.9.2
  workmanager_platform_interface: 0.9.2
  # dart_rss 3.0.3 pins intl ^0.19.0; flutter_localizations needs 0.20.x.
  intl: ^0.20.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  config:
    enable-swift-package-manager: true
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # Only runtime assets are bundled — assets/Logo.png is the launcher-icon
  # source (flutter_launcher_icons) and must not ship inside the app.
  assets:
    - assets/logo.ico
    - assets/js/
    # Font licenses, shown on the app's license page.
    - assets/fonts/Outfit/OFL.txt
    - assets/fonts/AtkinsonHyperlegibleNext/OFL.txt
    - assets/fonts/Lexend/OFL.txt
    - assets/fonts/Literata/OFL.txt
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Bundled OFL fonts (licenses beside each family). Nothing is fetched at
  # runtime; lib/theme/app_fonts.dart lists the families.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit/Outfit-ExtraBold.ttf
          weight: 800
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend/Lexend-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lexend/Lexend-ExtraBold.ttf
          weight: 800
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata/Literata-Regular.ttf
        - asset: assets/fonts/Literata/Literata-Medium.ttf
          weight: 500
        - asset: assets/fonts/Literata/Literata-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Literata/Literata-Bold.ttf
          weight: 700
        - asset: assets/fonts/Literata/Literata-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Literata/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/Literata/Literata-BoldItalic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  image_path: "assets/Logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FA7023"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
  linux:
    generate: true
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#ffffff"
