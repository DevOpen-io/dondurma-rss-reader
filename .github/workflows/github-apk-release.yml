# GitHub download distribution is separate from v* store-submission tags.
# Every CI-green main push publishes one release with an APK, a Windows
# installer (.exe), a macOS disk image (.dmg) and a Linux AppImage. The release
# job waits for all four builds, so a release never ships a partial set.
name: Publish GitHub release

on:
  workflow_run:
    workflows: ['CI and store releases']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-apk-publish
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.4'
  TESTED_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  preflight:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.current.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      basename: ${{ steps.version.outputs.basename }}
    steps:
      - name: Checkout exactly the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0

      - name: Skip superseded main commits
        id: current
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" == "$TESTED_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Skipping older CI commit $TESTED_SHA: main has moved." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read version and build from pubspec.yaml
        id: version
        run: |
          ruby <<'RUBY'
          source = File.read('pubspec.yaml')
          match = source.match(/^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)\s*$/)
          abort 'pubspec.yaml must contain version: MAJOR.MINOR.PATCH+POSITIVE_BUILD' unless match
          version, build = match.captures
          abort 'Android build number exceeds limit' if build.to_i > 2_100_000_000
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |f|
            f.puts "version=#{version}", "build=#{build}"
            f.puts "basename=Dondurma-v#{version}+#{build}-#{ENV.fetch('TESTED_SHA')[0, 7]}"
          end
          puts "GitHub release version: #{version}+#{build}"
          RUBY

  apk:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: /tmp/dondurma-upload.jks
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD: ${{ needs.preflight.outputs.build }}
      BASENAME: ${{ needs.preflight.outputs.basename }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Android upload keystore
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing $key repository secret; signed GitHub APK cannot be built."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null

      - name: Build signed APK using pubspec version
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build apk --release --no-tree-shake-icons --build-name="$VERSION" --build-number="$BUILD"

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/dondurma-upload.der" >/dev/null
          expected=$(openssl x509 -inform DER -in "$RUNNER_TEMP/dondurma-upload.der" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/dondurma-apk-verification.txt"
          grep -qi "certificate SHA-256 digest: $expected" "$RUNNER_TEMP/dondurma-apk-verification.txt"

      - name: Stage versioned APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$BASENAME.apk"
          echo "Signed GitHub APK: $BASENAME.apk" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "dist/$BASENAME.apk" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Remove temporary signing credentials
        if: always()
        run: |
          rm -f "$ANDROID_KEYSTORE_PATH" "$RUNNER_TEMP/dondurma-upload.der" "$RUNNER_TEMP/dondurma-apk-verification.txt"

  linux:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD: ${{ needs.preflight.outputs.build }}
      BASENAME: ${{ needs.preflight.outputs.basename }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release --build-name="$VERSION" --build-number="$BUILD"

      - name: Package AppImage
        run: |
          set -euo pipefail
          # The bundle resolves lib/ and data/ next to its binary; keep it whole.
          mkdir -p AppDir dist
          cp -r build/linux/x64/release/bundle/. AppDir/
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/dondurma" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/io.devopen.dondurma.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Dondurma RSS Reader
          Exec=dondurma
          Icon=io.devopen.dondurma
          Categories=Network;News;
          EOF
          cp assets/Logo.png AppDir/io.devopen.dondurma.png
          cp assets/Logo.png AppDir/.DirIcon
          # Extracted appimagetool needs no FUSE on the runner.
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          (cd "$RUNNER_TEMP" && ./appimagetool --appimage-extract >/dev/null)
          ARCH=x86_64 "$RUNNER_TEMP/squashfs-root/AppRun" AppDir "dist/$BASENAME-x86_64.AppImage"
          sha256sum dist/*.AppImage >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD: ${{ needs.preflight.outputs.build }}
      BASENAME: ${{ needs.preflight.outputs.basename }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --build-name="$env:VERSION" --build-number="$env:BUILD"

      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          # Flutter's Windows bundle does not include the VC++ runtime; ship it
          # so the app starts on machines without the redistributable.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DOutputName=$env:BASENAME-windows-x64-setup" windows\installer\dondurma.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist\*.exe -Algorithm SHA256 | Format-List | Out-String >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD: ${{ needs.preflight.outputs.build }}
      BASENAME: ${{ needs.preflight.outputs.basename }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get --enforce-lockfile
      # Not signed with a Developer ID or notarized; see the release notes.
      - run: flutter build macos --release --build-name="$VERSION" --build-number="$BUILD"

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p dmg dist
          ditto "build/macos/Build/Products/Release/Dondurma RSS Reader.app" "dmg/Dondurma RSS Reader.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Dondurma RSS Reader" -srcfolder dmg -ov -format UDZO \
            "dist/$BASENAME-macos.dmg"
          shasum -a 256 dist/*.dmg >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: [preflight, apk, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Prefix apk- avoids starting the existing store workflow's v* tag trigger.
          tag_name: apk-v${{ needs.preflight.outputs.version }}+${{ needs.preflight.outputs.build }}-ci${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ env.TESTED_SHA }}
          name: Dondurma v${{ needs.preflight.outputs.version }}+${{ needs.preflight.outputs.build }}
          body: |
            Built from CI-tested commit ${{ env.TESTED_SHA }}. Version and build number are read from pubspec.yaml.

            | Platform | File |
            | --- | --- |
            | Android | `.apk` (signed) |
            | Windows 10/11 x64 | `-windows-x64-setup.exe` installer |
            | macOS | `-macos.dmg` (drag the app into Applications) |
            | Linux x86_64 | `-x86_64.AppImage` (`chmod +x`, then run) |

            The Windows and macOS builds are not code-signed. Windows SmartScreen may show
            "Windows protected your PC" (choose More info → Run anyway). On macOS, open the app
            once from Finder with right-click → Open, or allow it in System Settings → Privacy & Security.

            GitHub distribution only; no Google Play or App Store submission.
          generate_release_notes: true
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
