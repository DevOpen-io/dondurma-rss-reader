name: CI and store releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Keep submissions serialized across tags and retries. Never cancel a submission.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'store-release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.4'
  FASTLANE_SKIP_UPDATE_CHECK: 'true'
  FASTLANE_HIDE_CHANGELOG: 'true'

jobs:
  preflight:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      build: ${{ steps.validate.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag, main ancestry and both platforms' credentials
        id: validate
        run: |
          ruby <<'RUBY'
          require 'base64'
          require 'json'
          tag = ENV.fetch('GITHUB_REF_NAME')
          abort 'Tag must be exactly vMAJOR.MINOR.PATCH' unless tag.match?(/\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z/)
          version = File.read('pubspec.yaml').match(/^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)\s*$/)
          abort 'Tag must match pubspec.yaml with an explicit positive build number' unless version && tag == "v#{version[1]}"
          abort 'Build number exceeds Android limit' if version[2].to_i > 2_100_000_000
          abort 'Release commit must be on main' unless system('git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main')
          required = %w[ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROFILE_BASE64 ASC_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID]
          missing = required.select { |key| ENV[key].to_s.strip.empty? }
          abort "Missing required secrets: #{missing.join(', ')}" unless missing.empty?
          required.grep(/_BASE64$/).each do |key|
            begin
              abort "Empty base64 secret: #{key}" if Base64.strict_decode64(ENV.fetch(key)).empty?
            rescue ArgumentError
              abort "Invalid base64 secret: #{key}"
            end
          end
          begin
            account = JSON.parse(ENV.fetch('PLAY_SERVICE_ACCOUNT_JSON'))
            abort 'Play key must be a service account' unless account['type'] == 'service_account' && %w[client_email private_key project_id].all? { |key| !account[key].to_s.empty? }
          rescue JSON::ParserError
            abort 'Invalid Play service account JSON'
          end
          abort 'Disable Play managed publishing and set PLAY_MANAGED_PUBLISHING_DISABLED=true' unless ENV['PLAY_MANAGED_PUBLISHING_DISABLED'] == 'true'
          notes = Dir.glob("fastlane/metadata/android/*/changelogs/#{version[2]}.txt")
          abort 'Add Play release notes at fastlane/metadata/android/<locale>/changelogs/<build>.txt' if notes.empty?
          notes.each do |path|
            text = File.read(path).strip
            abort "Play release notes must contain 1–500 characters: #{path}" unless (1..500).cover?(text.length)
          end
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |f| f.puts "version=#{version[1]}", "build=#{version[2]}" }
          puts "Validated #{tag} (#{version[2]}) on main; both platforms have required secrets."
          RUBY
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PLAY_MANAGED_PUBLISHING_DISABLED: ${{ vars.PLAY_MANAGED_PUBLISHING_DISABLED }}

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  ci-apk:
    if: "!startsWith(github.ref, 'refs/tags/')"
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  android-build:
    needs: [checks, preflight]
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore temporary android credentials
        run: |
          ruby <<'RUBY'
          require 'base64'
          require 'fileutils'
          root = File.join(ENV.fetch('RUNNER_TEMP'), 'store-credentials')
          FileUtils.mkdir_p(root, mode: 0700)
          { 'ANDROID_KEYSTORE_BASE64' => 'upload.jks' }.each do |key, name|
            path = File.join(root, name)
            File.write(path, Base64.strict_decode64(ENV.fetch(key)), mode: 'wb', perm: 0600)
          end
          File.write(File.join(root, 'play.json'), ENV.fetch('PLAY_SERVICE_ACCOUNT_JSON'), perm: 0600)
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |f|
            f.puts "CREDENTIAL_DIR=#{root}"
            f.puts "ANDROID_KEYSTORE_PATH=#{root}/upload.jks", "PLAY_JSON_PATH=#{root}/play.json"
          end
          RUBY
      - name: Check upload key before building
        run: |
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null
          keytool -importkeystore -srckeystore "$ANDROID_KEYSTORE_PATH" -srcalias "$ANDROID_KEY_ALIAS" -srcstorepass:env ANDROID_KEYSTORE_PASSWORD -srckeypass:env ANDROID_KEY_PASSWORD -destkeystore "$CREDENTIAL_DIR/validated.p12" -deststoretype PKCS12 -deststorepass:env ANDROID_KEY_PASSWORD -noprompt >/dev/null
      - run: flutter pub get --enforce-lockfile
      - name: Build signed AAB and APK
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_BUILD: ${{ needs.preflight.outputs.build }}
        run: |
          flutter build appbundle --release --no-tree-shake-icons --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD"
          flutter build apk --release --no-tree-shake-icons --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD"
      - name: Verify both Android artifact signatures
        run: |
          set -euo pipefail
          # Compare both signed artifacts with the supplied existing upload key.
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/upload.der" >/dev/null
          expected=$(openssl x509 -inform DER -in "$RUNNER_TEMP/upload.der" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          aab=build/app/outputs/bundle/release/app-release.aab
          apk=build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify "$aab" > "$RUNNER_TEMP/aab-verification.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/aab-verification.txt"
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$actual" == "$expected" ]] || { echo 'AAB certificate does not match upload key'; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-verification.txt"
          grep -qi "certificate SHA-256 digest: $expected" "$RUNNER_TEMP/apk-verification.txt"
          echo "Verified AAB and APK upload certificate SHA-256: $expected" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-store
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - if: always()
        name: Clean up temporary signing credentials
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/store-credentials/profile-path" ]]; then
            profile=$(cat "$RUNNER_TEMP/store-credentials/profile-path")
            rm -f -- "$profile"
          fi
          if [[ "${RUNNER_OS:-}" == macOS ]]; then
            security delete-keychain "$RUNNER_TEMP/store-release.keychain-db" 2>/dev/null || true
          fi
          rm -rf -- "$RUNNER_TEMP/store-credentials"
          rm -f -- "$RUNNER_TEMP/upload.der" "$RUNNER_TEMP/aab-verification.txt" "$RUNNER_TEMP/apk-verification.txt"

  ios-build:
    needs: [checks, preflight]
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Restore temporary ios credentials
        run: |
          ruby <<'RUBY'
          require 'base64'
          require 'fileutils'
          root = File.join(ENV.fetch('RUNNER_TEMP'), 'store-credentials')
          FileUtils.mkdir_p(root, mode: 0700)
          { 'APPLE_CERTIFICATE_BASE64' => 'distribution.p12', 'APPLE_PROFILE_BASE64' => 'app.mobileprovision', 'ASC_KEY_BASE64' => 'AuthKey.p8' }.each do |key, name|
            path = File.join(root, name)
            File.write(path, Base64.strict_decode64(ENV.fetch(key)), mode: 'wb', perm: 0600)
          end
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |f|
            f.puts "CREDENTIAL_DIR=#{root}"
          end
          RUBY
      - run: flutter pub get --enforce-lockfile
      - name: Generate iOS build settings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_BUILD: ${{ needs.preflight.outputs.build }}
        run: flutter build ios --release --config-only --no-codesign --no-tree-shake-icons --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD"
      - run: bundle exec fastlane ios build
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_BUILD: ${{ needs.preflight.outputs.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-store
          path: build/ios/ipa/Dondurma.ipa
          if-no-files-found: error
      - name: Record signed artifact
        run: echo 'Signed App Store IPA archived and exported with Apple Distribution for io.devopen.dondurma.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        name: Clean up temporary signing credentials
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/store-credentials/profile-path" ]]; then
            profile=$(cat "$RUNNER_TEMP/store-credentials/profile-path")
            rm -f -- "$profile"
          fi
          if [[ "${RUNNER_OS:-}" == macOS ]]; then
            security delete-keychain "$RUNNER_TEMP/store-release.keychain-db" 2>/dev/null || true
          fi
          rm -rf -- "$RUNNER_TEMP/store-credentials"
          rm -f -- "$RUNNER_TEMP/upload.der" "$RUNNER_TEMP/aab-verification.txt" "$RUNNER_TEMP/apk-verification.txt"

  android-submit:
    needs: [preflight, android-build, ios-build]
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PLAY_MANAGED_PUBLISHING_DISABLED: ${{ vars.PLAY_MANAGED_PUBLISHING_DISABLED }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_BUILD: ${{ needs.preflight.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: android-store
          path: downloaded
      - name: Stage bundle
        run: |
          mkdir -p artifacts
          find downloaded -name app-release.aab -exec cp '{}' artifacts/app-release.aab \;
      - name: Restore temporary android credentials
        run: |
          ruby <<'RUBY'
          require 'base64'
          require 'fileutils'
          root = File.join(ENV.fetch('RUNNER_TEMP'), 'store-credentials')
          FileUtils.mkdir_p(root, mode: 0700)
          { 'ANDROID_KEYSTORE_BASE64' => 'upload.jks' }.each do |key, name|
            path = File.join(root, name)
            File.write(path, Base64.strict_decode64(ENV.fetch(key)), mode: 'wb', perm: 0600)
          end
          File.write(File.join(root, 'play.json'), ENV.fetch('PLAY_SERVICE_ACCOUNT_JSON'), perm: 0600)
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |f|
            f.puts "CREDENTIAL_DIR=#{root}"
            f.puts "ANDROID_KEYSTORE_PATH=#{root}/upload.jks", "PLAY_JSON_PATH=#{root}/play.json"
          end
          RUBY
      - run: bundle exec fastlane android verify_access
      - run: bundle exec fastlane android release
      - name: Submission result
        if: always()
        env:
          RESULT: ${{ job.status }}
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD: ${{ needs.preflight.outputs.build }}
        run: echo "Play production submission $VERSION ($BUILD) — $RESULT. Approval is tracked in Play Console." >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        name: Clean up temporary signing credentials
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/store-credentials/profile-path" ]]; then
            profile=$(cat "$RUNNER_TEMP/store-credentials/profile-path")
            rm -f -- "$profile"
          fi
          if [[ "${RUNNER_OS:-}" == macOS ]]; then
            security delete-keychain "$RUNNER_TEMP/store-release.keychain-db" 2>/dev/null || true
          fi
          rm -rf -- "$RUNNER_TEMP/store-credentials"
          rm -f -- "$RUNNER_TEMP/upload.der" "$RUNNER_TEMP/aab-verification.txt" "$RUNNER_TEMP/apk-verification.txt"

  ios-submit:
    needs: [preflight, android-build, ios-build]
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_BUILD: ${{ needs.preflight.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ios-store
          path: artifacts
      - name: Restore temporary ios credentials
        run: |
          ruby <<'RUBY'
          require 'base64'
          require 'fileutils'
          root = File.join(ENV.fetch('RUNNER_TEMP'), 'store-credentials')
          FileUtils.mkdir_p(root, mode: 0700)
          { 'APPLE_CERTIFICATE_BASE64' => 'distribution.p12', 'APPLE_PROFILE_BASE64' => 'app.mobileprovision', 'ASC_KEY_BASE64' => 'AuthKey.p8' }.each do |key, name|
            path = File.join(root, name)
            File.write(path, Base64.strict_decode64(ENV.fetch(key)), mode: 'wb', perm: 0600)
          end
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |f|
            f.puts "CREDENTIAL_DIR=#{root}"
          end
          RUBY
      - run: bundle exec fastlane ios verify_access
      - run: bundle exec fastlane ios release
      - name: Submission result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "App Review submission $RELEASE_VERSION ($RELEASE_BUILD) — $RESULT. Automatic release after approval requested." >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        name: Clean up temporary signing credentials
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/store-credentials/profile-path" ]]; then
            profile=$(cat "$RUNNER_TEMP/store-credentials/profile-path")
            rm -f -- "$profile"
          fi
          if [[ "${RUNNER_OS:-}" == macOS ]]; then
            security delete-keychain "$RUNNER_TEMP/store-release.keychain-db" 2>/dev/null || true
          fi
          rm -rf -- "$RUNNER_TEMP/store-credentials"
          rm -f -- "$RUNNER_TEMP/upload.der" "$RUNNER_TEMP/aab-verification.txt" "$RUNNER_TEMP/apk-verification.txt"

  github-release:
    needs: [preflight, android-build, ios-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-store'
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa
          fail_on_unmatched_files: true
