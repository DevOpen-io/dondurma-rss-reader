# Desktop builds are intentionally a separate workflow from build-and-release.yml
# so store submissions stay independent and cannot be blocked or cancelled by
# desktop job failures. No tags, no signing, no store uploads — compile +
# portable artifacts only.
name: Desktop builds

on:
  pull_request:
  push:
    branches: [main, 'feature/*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - name: Package portable tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/dondurma-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: dondurma-linux-x64
          path: dondurma-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath dondurma-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dondurma-windows-x64
          path: dondurma-windows-x64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get --enforce-lockfile
      # Unsigned debug-signed release build — artifact runs locally but is not
      # notarized. Signing/notarization secrets are a follow-up release task.
      - run: flutter build macos --release
      - name: Package .app artifact
        run: |
          cd "build/macos/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent \
            "Dondurma RSS Reader.app" \
            "$GITHUB_WORKSPACE/dondurma-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dondurma-macos
          path: dondurma-macos.zip
          if-no-files-found: error
